[workspace]
resolver = "2"
members = [
    "crates/amalith-trace",
    "crates/amalith-script",
    "crates/amalith-core",
    "crates/amalith-commands",
    "crates/amalith-io",
    "crates/amalith-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kurbo = { version = "0.11", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
roxmltree = "0.20"
zstd = "0.13"

# `[profile.dev.package."*"]` only touches dependencies, never the
# workspace's own crates — those keep opt-level 0 (fast incremental
# builds, full debug info). Without this, a plain `cargo run` compiles
# lopdf/zip/zstd/image fully unoptimized, and byte-level PDF parsing on a
# real-world multi-hundred-MB .ai file becomes 10-30x slower than a
# release build for no benefit (nobody steps through their source) —
# easily read as a hang rather than just a slow debug build.
[profile.dev.package."*"]
opt-level = 2
