[workspace]
resolver = "2"
members = [
    "crates/amalith-trace",
    "crates/amalith-script",
    "crates/amalith-core",
    "crates/amalith-commands",
    "crates/amalith-io",
    "crates/amalith-shell",
    "crates/amalith-console",
    "crates/amalith-adjust",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kurbo = { version = "0.11", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
roxmltree = "0.20"
zstd = "0.13"

# The workspace's own crates. At opt-level 0 the renderer's per-frame CPU
# work — path -> BezPath conversion, bounds/culling math, transforms — runs
# unoptimized on every object every frame, which drops a 15k-anchor document
# from 100+ fps to 20-30 and reads as a renderer problem rather than a debug
# build. Level 1 recovers nearly all of that and still keeps incremental
# builds quick and debug info intact; level 2 costs noticeably more compile
# time for no perceptible gain here.
[profile.dev]
opt-level = 1

# `[profile.dev.package."*"]` only touches dependencies, never the
# workspace's own crates (those are `[profile.dev]` above). Without this,
# dependencies would stay at that lower level too, and a plain `cargo run`
# would compile
# lopdf/zip/zstd/image fully unoptimized, and byte-level PDF parsing on a
# real-world multi-hundred-MB .ai file becomes 10-30x slower than a
# release build for no benefit (nobody steps through their source) —
# easily read as a hang rather than just a slow debug build.
[profile.dev.package."*"]
opt-level = 2
