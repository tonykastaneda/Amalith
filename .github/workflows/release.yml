name: Release

# Push a tag like v0.0.1 (or run this manually with a version input) to
# build unsigned release artifacts and publish a GitHub Release with a
# macOS DMG, a Windows zip, and a Linux zip attached. The Linux zip bundles
# every install method package-linux.sh produces — AppImage, deb, rpm,
# portable tarball and the Arch PKGBUILD — so the page carries one Linux
# asset rather than four.
#
# The macOS DMG is signed with the Developer ID certificate and notarized
# by Apple (Apple Silicon only), using these repo secrets:
#   MACOS_CERT_P12        base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD   password for that .p12
#   APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID   notarytool credentials
# The Windows build is not code-signed yet, so SmartScreen will show an
# "unknown publisher" warning on first run.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.0.1) — only needed for a manual run off a non-tag commit"
        required: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate and notary credentials
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "Developer ID identity not found"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials amalith-ci --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "NOTARY_PROFILE=amalith-ci" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-macos.sh

      - name: Verify Gatekeeper acceptance
        run: |
          test "$(lipo -archs dist/mac/Amalith.app/Contents/MacOS/Amalith)" = "arm64"
          spctl -a -vv -t exec dist/mac/Amalith.app
          spctl -a -vv -t open --context context:primary-signature dist/mac/Amalith.dmg
          xcrun stapler validate dist/mac/Amalith.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/mac/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: target/package/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build + packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libwayland-dev pkg-config rpm squashfs-tools zip
          sudo curl -L -o /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # appimagetool ships as an AppImage itself; this makes it extract
          # and run in place instead of mounting via FUSE, which the CI
          # runner doesn't have set up.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/package-linux.sh

      - name: Check the zip carries every install method
        run: |
          zip="dist/linux/Amalith-Linux.zip"
          for want in INSTALL.txt SHA256SUMS arch/PKGBUILD .AppImage .deb .rpm .tar.gz; do
            unzip -l "$zip" | grep -q -- "$want" || { echo "missing from zip: $want"; exit 1; }
          done
          unzip -l "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: dist/linux/Amalith-Linux.zip

  release:
    # Manual runs only build (useful for testing signing); tags publish.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-zip/*.zip
            artifacts/linux-zip/*.zip
          prerelease: false
          generate_release_notes: true
