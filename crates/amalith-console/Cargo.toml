[package]
name = "amalith-console"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows console front door: installed as Amalith.com beside Amalith.exe so terminals wait for `Amalith script` and get its output and exit code."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
