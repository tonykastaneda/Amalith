[package]
name = "amalith-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Amalith's custom UI shell: winit + wgpu + vello. Windows, input, the dock system, and panels — no widget toolkit."

[lib]
name = "amalith_shell"
path = "src/lib.rs"

# Binary name is the process name macOS shows in the Dock tooltip and the
# bold app menu (there's no .app bundle to override it yet).
[[bin]]
name = "Amalith"
path = "src/main.rs"

[dependencies]
vello = "0.10"
winit = "0.30"
pollster = "0.4"
kurbo.workspace = true
parley = { version = "0.11", features = ["system"] }
# Glyph outline extraction for Type ▸ Create Outlines (matches parley's).
skrifa = "0.44"
amalith-core = { path = "../amalith-core" }
amalith-commands = { path = "../amalith-commands" }
amalith-io = { path = "../amalith-io" }
rfd.workspace = true
# Text-only OS clipboard, for SVG copy/paste with Illustrator & the web.
arboard = { version = "3.6", default-features = false }
# Decode the embedded app-icon PNG (branding/app-icon.png).
png = "0.18"
# Raster decode for File ▸ Place / drag-and-drop (PNG + JPEG).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Workspace / dock-layout persistence (JSON next to settings.txt).
serde = { workspace = true }
serde_json = { workspace = true }

# Native menu bar: NSMenu on macOS, an HMENU attached to the window on Windows.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
# Set the Dock / Cmd-Tab icon at runtime, since we don't ship an .app bundle yet.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSDragging",
    "NSEvent",
    "NSFilePromiseReceiver",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSResponder",
    "NSView",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSString",
    "NSURL",
] }
# ImageIO thumbnails for progressive Place (LOD) — thread-safe, no full decode.
objc2-core-foundation = { version = "0.3", features = [
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
] }
